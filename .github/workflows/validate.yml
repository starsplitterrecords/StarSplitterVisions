name: Validate Visions site

on:
  pull_request:
    paths:
      - 'sites/visions/src/**'
      - 'sites/visions/public/images/**'
      - 'sites/visions/public/issues/**'
      - 'sites/visions/index.html'
      - 'sites/visions/package.json'
      - 'sites/visions/package-lock.json'
      - 'sites/visions/vite.config.js'
      - 'sites/visions/vercel.json'
      - 'sites/visions/scripts/prerender-seo.js'
      - 'sites/visions/public/robots.txt'
      - '.github/workflows/visions-seo-check.yml'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]
    paths:
      - 'sites/visions/src/**'
      - 'sites/visions/public/images/**'
      - 'sites/visions/public/issues/**'
      - 'sites/visions/index.html'
      - 'sites/visions/package.json'
      - 'sites/visions/package-lock.json'
      - 'sites/visions/vite.config.js'
      - 'sites/visions/vercel.json'
      - 'sites/visions/scripts/prerender-seo.js'
      - 'sites/visions/public/robots.txt'
      - '.github/workflows/visions-seo-check.yml'
      - '.github/workflows/validate.yml'

permissions:
  contents: read

jobs:
  visions:
    name: Star Splitter Visions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sites/visions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sites/visions/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate crawlable SEO output
        run: |
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/series/rex-fleet.html
          grep -q 'rel="canonical"' dist/series/rex-fleet.html
          grep -q 'application/ld+json' dist/series/rex-fleet.html
          grep -q 'Commodore Ella Venn' dist/series/rex-fleet.html
          grep -q 'https://star-splitter-visions.vercel.app/series/rex-fleet' dist/sitemap.xml

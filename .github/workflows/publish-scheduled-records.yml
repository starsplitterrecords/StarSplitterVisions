name: Publish scheduled Records releases

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-scheduled-records
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Record newly due releases
        working-directory: sites/records
        run: node scripts/publish-scheduled.mjs
      - name: Trigger production deployment when needed
        shell: bash
        run: |
          if git diff --quiet -- sites/records/.published-schedule.json; then
            echo "No release became due."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sites/records/.published-schedule.json
          git commit -m "publish: release scheduled Records content"
          git push origin HEAD:main

  - name: records-artists
    label: Records — Artists
    type: collection
    path: sites/records/content/artists
    format: json
    filename: "{fields.slug}.json"
    view:
      primary: name
      fields: [name, status, field, catalogRole, featured]
      sort: [name, status]
      search: [name, slug, field, tagline, catalogRole, roleStatement, oneSentenceBio]
      default:
        sort: name
        order: asc
    fields:
      - name: name
        label: Artist / Project Name
        type: string
        required: true
      - name: slug
        label: URL Slug
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9-]+$"
          message: "Use lowercase letters, numbers, and hyphens only."
      - name: status
        type: select
        required: true
        options:
          values:
            - name: active
              label: Active
            - name: archived
              label: Archived
      - name: featured
        type: boolean
      - name: field
        label: Public Musical Orientation
        type: string
        required: true
      - name: category
        label: Internal Category
        type: string
      - name: categories
        label: Homepage Filters
        type: select
        list: true
        options:
          values:
            - rock
            - electronic
            - songs
            - cinematic
            - roots
            - experimental
      - name: tagline
        type: text
        required: true
      - name: catalogRole
        label: Role in the Catalog — Heading
        type: string
        required: true
        description: Short listener-facing role label, such as Direct artist identity or Reconstruction project.
      - name: roleStatement
        label: Role in the Catalog — Statement
        type: text
        required: true
        description: Explains what this project contributes to the larger catalog without describing fictional biography.
      - name: accent
        label: Accent Color
        type: string
        required: true
      - name: identityImage
        label: Identity Artwork
        type: image
        options:
          media: records-images
        required: true
      - name: worldImage
        label: Secondary / World Artwork
        type: image
        options:
          media: records-images
      - name: oneSentenceBio
        label: One-Sentence Bio
        type: text
        required: true
      - name: threeSentenceBio
        label: Short Bio
        type: text
        required: true
      - name: paragraphBio
        label: Full Bio
        type: text
        required: true
      - name: riyl
        label: Recommended If You Like
        type: text
      - name: listenUrl
        label: Primary Listening URL
        type: string
      - name: platformLinks
        label: Artist Listening Links
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            type: string
            required: true
          - name: url
            type: string
            required: true
      - name: motion
        label: Motion Identity
        type: object
        fields:
          - name: video
            label: Video URL
            type: string
          - name: poster
            type: image
            options:
              media: records-images
          - name: title
            type: string
      - name: releases
        label: Releases
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} — {meta}"
        fields:
          - name: title
            type: string
            required: true
          - name: slug
            label: Release URL Slug
            type: string
            required: true
            pattern:
              regex: "^[a-z0-9-]+$"
              message: "Use lowercase letters, numbers, and hyphens only."
          - name: meta
            label: Public Status / Date Line
            type: string
            required: true
          - name: description
            label: Release Description
            type: text
            description: Listener-facing overview of this recording. Leave blank until confirmed.
          - name: image
            type: image
            options:
              media: records-images
          - name: links
            label: Listening and External Links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: label
                type: string
                required: true
              - name: url
                type: string
                required: true
          - name: lineage
            label: Credits and Lineage
            type: object
            description: Keep Display hidden until the public summary and any shown fields are accurate.
            fields:
              - name: display
                label: Public Display
                type: select
                required: true
                options:
                  values:
                    - name: hidden
                      label: Hidden — structure only
                    - name: summary
                      label: Summary — public note and high-level relationship
                    - name: full
                      label: Full — note, credits, process, source, and related releases
              - name: publicLabel
                label: Release Card Relationship Label
                type: string
                description: Optional public label such as Original, New interpretation, Legacy recording, Remix, or Alternate version.
              - name: compositionOrigin
                label: Composition Origin
                type: select
                required: true
                options:
                  values:
                    - name: undocumented
                      label: Not documented yet
                    - name: human-composed
                      label: Human-composed
                    - name: co-written
                      label: Co-written
                    - name: generative-starting-point
                      label: Generative starting point
                    - name: adapted-from-existing-work
                      label: Adapted from an existing work
                    - name: public-domain-or-traditional
                      label: Public-domain or traditional source
                    - name: other
                      label: Other
              - name: realizationMethod
                label: Realization Method
                type: select
                required: true
                options:
                  values:
                    - name: undocumented
                      label: Not documented yet
                    - name: performed-and-produced
                      label: Performed and produced
                    - name: ai-assisted-realization
                      label: AI-assisted realization
                    - name: hybrid-realization
                      label: Hybrid realization
                    - name: restored-source-recording
                      label: Restored source recording
                    - name: generative-production
                      label: Generative production
                    - name: other
                      label: Other
              - name: versionRelationship
                label: Version Relationship
                type: select
                required: true
                options:
                  values:
                    - name: undocumented
                      label: Not documented yet
                    - name: original-release
                      label: Original release
                    - name: new-interpretation
                      label: New interpretation
                    - name: legacy-recording
                      label: Legacy recording
                    - name: remix
                      label: Remix
                    - name: remaster-or-restoration
                      label: Remaster or restoration
                    - name: alternate-version
                      label: Alternate version
                    - name: adaptation
                      label: Adaptation
                    - name: other
                      label: Other
              - name: sourceTitle
                label: Source Composition / Recording Title
                type: string
              - name: sourceArtist
                label: Source Artist / Project
                type: string
              - name: sourceUrl
                label: Source Work URL
                type: string
              - name: publicSummary
                label: Public Credits and Lineage Summary
                type: text
                description: Required before public display. State what actually happened without defending or reducing the release to a tool label.
              - name: methodNote
                label: Public Process Note
                type: text
                description: Optional detail about arrangement, performance, generation, recording, production, editing, or selection.
              - name: credits
                label: Credits
                type: object
                fields:
                  - name: composition
                    type: string
                  - name: lyrics
                    type: string
                  - name: arrangement
                    type: string
                  - name: performance
                    type: string
                  - name: production
                    type: string
                  - name: finalEditingAndCuration
                    label: Final Editing and Curation
                    type: string
              - name: relatedReleases
                label: Related Releases
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{label}"
                fields:
                  - name: label
                    label: Public Link Label
                    type: string
                    required: true
                  - name: artist
                    type: string
                  - name: title
                    type: string
                  - name: url
                    type: string
                    required: true
      - name: seoTitle
        label: SEO Title
        type: string
      - name: seoDescription
        label: SEO Description
        type: text


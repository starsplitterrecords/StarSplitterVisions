name: Materialize complete Records site once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/materialize-records-once.yml'

permissions:
  contents: write

jobs:
  materialize-records:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out Records branch
        uses: actions/checkout@v4
        with:
          ref: records-site-cms
          fetch-depth: 0

      - name: Reconstruct complete Records source
        shell: bash
        run: |
          set -euo pipefail
          count=$(find .records-bootstrap/source -maxdepth 1 -name 'part-*' | wc -l)
          test "$count" -eq 16
          cat .records-bootstrap/source/part-* | base64 -d > /tmp/records-site.tar.gz
          tar -tzf /tmp/records-site.tar.gz >/tmp/records-site-files.txt
          test -s /tmp/records-site-files.txt
          tar -xzf /tmp/records-site.tar.gz -C .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Visions
        run: npm run check

      - name: Build Visions
        run: npm run build

      - name: Validate and build Records
        run: npm run check:records

      - name: Commit complete Records website
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .records-bootstrap
          rm -f .github/workflows/materialize-records-site.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Commit complete Star Splitter Records website"
          git push origin HEAD:records-site-cms

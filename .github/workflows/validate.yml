name: Validate both sites

on:
  pull_request:
  push:
    branches:
      - main
      - agent/**

permissions:
  contents: write

jobs:
  migrate-roster-sort:
    name: Migrate numeric roster groups
    if: github.ref_name == 'agent/numeric-roster-sort-groups' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/numeric-roster-sort-groups
          fetch-depth: 0
      - name: Apply migration
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          pages_path = Path('.pages.yml')
          pages = pages_path.read_text()
          old_view = '      fields: [name, status, field, featured]\n      sort: [name, status]\n      search: [name, slug, field, tagline, oneSentenceBio, paragraphBio]'
          new_view = '      fields: [name, status, field, sortGroup, featured]\n      sort: [sortGroup, name, status]\n      search: [name, slug, field, sortGroup, tagline, oneSentenceBio, paragraphBio]'
          if old_view not in pages:
              raise SystemExit('Could not find Records artist collection view')
          pages = pages.replace(old_view, new_view, 1)
          old_featured = '''      - name: featured
        type: boolean
      - name: field
'''
          new_featured = '''      - name: featured
        type: boolean
        description: Independent editorial flag. It does not control roster order.
      - name: sortGroup
        label: Roster Sort Group
        type: number
        required: true
        description: Lower numbers appear first. Projects within the same group are alphabetical. Jeff Hines is group 1; the current priority tier is group 2; use 3, 4, or higher for additional groupings.
      - name: field
'''
          if old_featured not in pages:
              raise SystemExit('Could not find featured field')
          pages_path.write_text(pages.replace(old_featured, new_featured, 1))

          publishing_path = Path('sites/records/scripts/publishing.mjs')
          publishing = publishing_path.read_text()
          old_order = '''export const orderArtists = (artists) => [...artists].sort((left, right) => {
  if (left.slug === 'jeff-hines') return -1
  if (right.slug === 'jeff-hines') return 1
  if (left.featured !== right.featured) return left.featured ? -1 : 1
  return left.name.localeCompare(right.name, 'en', { sensitivity: 'base' })
})'''
          new_order = '''export const orderArtists = (artists) => [...artists].sort((left, right) => {
  if (left.sortGroup !== right.sortGroup) return left.sortGroup - right.sortGroup
  return left.name.localeCompare(right.name, 'en', { sensitivity: 'base' })
})'''
          if old_order not in publishing:
              raise SystemExit('Could not find legacy ordering function')
          publishing_path.write_text(publishing.replace(old_order, new_order, 1))

          build_path = Path('sites/records/scripts/build.mjs')
          build = build_path.read_text()
          old_required = "for (const field of ['name', 'slug', 'field', 'tagline', 'identityImage']) {"
          new_required = "for (const field of ['name', 'slug', 'sortGroup', 'field', 'tagline', 'identityImage']) {"
          if old_required not in build:
              raise SystemExit('Could not find required artist fields')
          build = build.replace(old_required, new_required, 1)
          anchor = "    if (slugs.has(artist.slug)) throw new Error(`Duplicate artist slug: ${artist.slug}`)"
          insertion = "    if (!Number.isInteger(artist.sortGroup) || artist.sortGroup < 1) throw new Error(`${artist.name} must have a positive integer sortGroup`)\n" + anchor
          if anchor not in build:
              raise SystemExit('Could not find artist validation anchor')
          build_path.write_text(build.replace(anchor, insertion, 1))

          test_path = Path('sites/records/scripts/publishing.test.mjs')
          tests = test_path.read_text()
          start = tests.index("test('roster keeps Jeff first")
          end = tests.index("\n\ntest('scheduled release keys", start)
          replacement = '''test('roster sorts by numeric group, then A-Z, without archived artists', () => {
  const ordered = orderArtists([
    { name: 'Zulu', slug: 'zulu', status: 'active', featured: true, sortGroup: 4 },
    { name: 'Beta', slug: 'beta', status: 'active', featured: false, sortGroup: 2 },
    { name: 'Jeff Hines', slug: 'jeff-hines', status: 'active', featured: false, sortGroup: 1 },
    { name: 'Alpha', slug: 'alpha', status: 'active', featured: true, sortGroup: 2 },
    { name: 'Archived', slug: 'archived', status: 'archived', featured: true, sortGroup: 1 },
    { name: 'Able', slug: 'able', status: 'active', featured: false, sortGroup: 3 },
  ])
  assert.deepEqual(rosterArtists(ordered).map((artist) => artist.slug), ['jeff-hines', 'alpha', 'beta', 'able', 'zulu'])
})'''
          test_path.write_text(tests[:start] + replacement + tests[end:])

          migrated = []
          for artist_path in sorted(Path('sites/records/content/artists').glob('*.json')):
              artist = json.loads(artist_path.read_text())
              group = 1 if artist.get('slug') == 'jeff-hines' else 2 if artist.get('featured') is True else 3
              artist['sortGroup'] = group
              artist_path.write_text(json.dumps(artist, indent=2, ensure_ascii=False) + '\n')
              migrated.append((group, artist.get('name'), bool(artist.get('featured'))))

          print(f'Migrated {len(migrated)} projects:')
          for group, name, featured in migrated:
              print(f'group {group}: {name} (featured={featured})')
          PY
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pages.yml sites/records/scripts/publishing.mjs sites/records/scripts/publishing.test.mjs sites/records/scripts/build.mjs sites/records/content/artists/*.json
          git commit -m "Use numeric roster sort groups"
          git push origin HEAD:agent/numeric-roster-sort-groups

  visions:
    name: Star Splitter Visions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sites/visions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sites/visions/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  records:
    name: Star Splitter Records content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sites/records
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sites/records/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

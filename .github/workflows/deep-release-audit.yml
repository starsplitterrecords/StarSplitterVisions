name: Deep Release Validation and Source Forensics
on:
  pull_request:
    paths:
      - 'sites/visions/scripts/deep-release-audit.py'
      - '.github/workflows/deep-release-audit.yml'
      - 'sites/visions/src/content/series/**'
      - 'sites/visions/public/images/pages/**'
      - 'sites/visions/public/images/covers/**'
      - 'sites/visions/public/issues/**'
  push:
    branches: [main]
    paths:
      - 'sites/visions/scripts/deep-release-audit.py'
      - '.github/workflows/deep-release-audit.yml'
      - 'sites/visions/src/content/series/**'
      - 'sites/visions/public/images/pages/**'
      - 'sites/visions/public/images/covers/**'
      - 'sites/visions/public/issues/**'
permissions:
  contents: read
jobs:
  forensic-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: sites/visions
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sites/visions/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check && npm run build
      - run: python -m pip install pillow pymupdf
      - name: Run strict published-release validation (must visibly report six damaged images)
        shell: bash
        run: |
          set +e
          node scripts/audit-published-releases.js --strict > /tmp/strict-release.log 2>&1
          status=$?
          set -e
          cat /tmp/strict-release.log
          if [ "$status" -ne 0 ]; then
            echo "::warning::Strict release audit FAILS; known defects remain damaged, not certified as healthy."
          fi
      - name: Decode all reader images, covers and collected PDFs; derive source evidence
        run: python scripts/deep-release-audit.py --expect-known --report /tmp/release-audit/register.json --candidates /tmp/release-audit/candidates
      - name: Probe every reader/series route and release binary on deployed site
        continue-on-error: true
        run: python scripts/deep-release-audit.py --expect-known --live --report /tmp/release-audit/live.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-release-audit-${{ github.run_id }}
          path: /tmp/release-audit/
          retention-days: 14
          if-no-files-found: warn

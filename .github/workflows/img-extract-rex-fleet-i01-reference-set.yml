name: IMG extract Rex Fleet I01 reference set

on:
  push:
    branches:
      - img-extract-rex-fleet-i01-p019-20260906
    paths:
      - '.github/workflows/img-extract-rex-fleet-i01-reference-set.yml'

permissions:
  contents: read

jobs:
  export-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Visions
        uses: actions/checkout@v4
      - name: Verify issue assets exist
        run: test -f sites/visions/public/images/pages/rex-fleet/issue-01/page-019.jpg
      - name: Upload canonical issue pages
        uses: actions/upload-artifact@v4
        with:
          name: rex-fleet-issue-01-reference-set
          path: sites/visions/public/images/pages/rex-fleet/issue-01/*.jpg
          if-no-files-found: error
          retention-days: 1

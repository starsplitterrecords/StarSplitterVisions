name: Validate Visions deep-link hosting
on:
  pull_request:
    paths:
      - 'sites/visions/vercel.json'
      - 'sites/visions/scripts/audit-spa-rewrites.js'
      - 'sites/visions/src/utils/routes.js'
      - '.github/workflows/validate-spa-routes.yml'
  push:
    branches: [main]
    paths:
      - 'sites/visions/vercel.json'
      - 'sites/visions/scripts/audit-spa-rewrites.js'
      - 'sites/visions/src/utils/routes.js'
      - '.github/workflows/validate-spa-routes.yml'
jobs:
  rewrite-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/visions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/audit-spa-rewrites.js

name: Migrate roster sort groups

on:
  push:
    branches:
      - agent/numeric-roster-sort-groups

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/numeric-roster-sort-groups
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply numeric roster sort groups
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          pages_path = Path('.pages.yml')
          pages = pages_path.read_text()
          pages = pages.replace(
              '      fields: [name, status, field, featured]\n      sort: [name, status]\n      search: [name, slug, field, tagline, oneSentenceBio, paragraphBio]',
              '      fields: [name, status, field, sortGroup, featured]\n      sort: [sortGroup, name, status]\n      search: [name, slug, field, sortGroup, tagline, oneSentenceBio, paragraphBio]'
          )
          marker = '''      - name: featured
        type: boolean
      - name: field
'''
          replacement = '''      - name: featured
        type: boolean
        description: Independent editorial flag. It does not control roster order.
      - name: sortGroup
        label: Roster Sort Group
        type: number
        required: true
        description: Lower numbers appear first. Projects within the same group are alphabetical. Jeff Hines is group 1; the current priority tier is group 2; use 3, 4, or higher for additional groupings.
      - name: field
'''
          if marker not in pages:
              raise SystemExit('Could not find Pages CMS featured field block')
          pages = pages.replace(marker, replacement, 1)
          pages_path.write_text(pages)

          publishing_path = Path('sites/records/scripts/publishing.mjs')
          publishing = publishing_path.read_text()
          old_order = '''export const orderArtists = (artists) => [...artists].sort((left, right) => {
  if (left.slug === 'jeff-hines') return -1
  if (right.slug === 'jeff-hines') return 1
  if (left.featured !== right.featured) return left.featured ? -1 : 1
  return left.name.localeCompare(right.name, 'en', { sensitivity: 'base' })
})'''
          new_order = '''export const orderArtists = (artists) => [...artists].sort((left, right) => {
  const leftGroup = Number.isInteger(left.sortGroup) ? left.sortGroup : Number.MAX_SAFE_INTEGER
  const rightGroup = Number.isInteger(right.sortGroup) ? right.sortGroup : Number.MAX_SAFE_INTEGER
  if (leftGroup !== rightGroup) return leftGroup - rightGroup
  return left.name.localeCompare(right.name, 'en', { sensitivity: 'base' })
})'''
          if old_order not in publishing:
              raise SystemExit('Could not find legacy artist ordering function')
          publishing_path.write_text(publishing.replace(old_order, new_order, 1))

          build_path = Path('sites/records/scripts/build.mjs')
          build = build_path.read_text()
          old_required = "for (const field of ['name', 'slug', 'field', 'tagline', 'identityImage']) {"
          new_required = "for (const field of ['name', 'slug', 'sortGroup', 'field', 'tagline', 'identityImage']) {"
          if old_required not in build:
              raise SystemExit('Could not find artist required-field validation')
          build = build.replace(old_required, new_required, 1)
          validation_anchor = "    if (slugs.has(artist.slug)) throw new Error(`Duplicate artist slug: ${artist.slug}`)"
          validation_insert = "    if (!Number.isInteger(artist.sortGroup) || artist.sortGroup < 1) throw new Error(`${artist.name} must have a positive integer sortGroup`)\n" + validation_anchor
          if validation_anchor not in build:
              raise SystemExit('Could not find sort-group validation anchor')
          build_path.write_text(build.replace(validation_anchor, validation_insert, 1))

          test_path = Path('sites/records/scripts/publishing.test.mjs')
          tests = test_path.read_text()
          old_test = '''test('roster keeps Jeff first, then featured A-Z, then active A-Z, without archived artists', () => {
  const ordered = orderArtists([
    { name: 'Zulu', slug: 'zulu', status: 'active', featured: false },
    { name: 'Beta', slug: 'beta', status: 'active', featured: true },
    { name: 'Jeff Hines', slug: 'jeff-hines', status: 'active', featured: false },
    { name: 'Alpha', slug: 'alpha', status: 'active', featured: true },
    { name: 'Archived', slug: 'archived', status: 'archived', featured: true },
    { name: 'Able', slug: 'able', status: 'active', featured: false },
  ])
  assert.deepEqual(rosterArtists(ordered).map((artist) => artist.slug), ['jeff-hines', 'alpha', 'beta', 'able', 'zulu'])
})'''
          new_test = '''test('roster sorts by numeric group, then A-Z, without archived artists', () => {
  const ordered = orderArtists([
    { name: 'Zulu', slug: 'zulu', status: 'active', featured: true, sortGroup: 4 },
    { name: 'Beta', slug: 'beta', status: 'active', featured: false, sortGroup: 2 },
    { name: 'Jeff Hines', slug: 'jeff-hines', status: 'active', featured: false, sortGroup: 1 },
    { name: 'Alpha', slug: 'alpha', status: 'active', featured: true, sortGroup: 2 },
    { name: 'Archived', slug: 'archived', status: 'archived', featured: true, sortGroup: 1 },
    { name: 'Able', slug: 'able', status: 'active', featured: false, sortGroup: 3 },
  ])
  assert.deepEqual(rosterArtists(ordered).map((artist) => artist.slug), ['jeff-hines', 'alpha', 'beta', 'able', 'zulu'])
})'''
          if old_test not in tests:
              raise SystemExit('Could not find legacy roster ordering test')
          test_path.write_text(tests.replace(old_test, new_test, 1))

          artist_dir = Path('sites/records/content/artists')
          migrated = []
          for artist_path in sorted(artist_dir.glob('*.json')):
              artist = json.loads(artist_path.read_text())
              if artist.get('slug') == 'jeff-hines':
                  group = 1
              elif artist.get('featured') is True:
                  group = 2
              else:
                  group = 3
              artist['sortGroup'] = group
              artist_path.write_text(json.dumps(artist, indent=2, ensure_ascii=False) + '\n')
              migrated.append((artist.get('name'), group, bool(artist.get('featured'))))

          print(f'Migrated {len(migrated)} artist records')
          for name, group, featured in migrated:
              print(f'{group}: {name} (featured={featured})')
          PY
      - name: Validate Records site
        run: |
          npm install
          npm run test:records
          npm run build:records
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pages.yml sites/records/scripts/publishing.mjs sites/records/scripts/publishing.test.mjs sites/records/scripts/build.mjs sites/records/content/artists/*.json
          git commit -m "Use numeric roster sort groups"
          git push origin HEAD:agent/numeric-roster-sort-groups

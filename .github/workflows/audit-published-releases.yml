name: Audit Published Comic Releases
on:
  workflow_dispatch:
    inputs:
      probe_live:
        description: 'Check deployed cover/PDF HTTP responses (advisory)'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  releases:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sites/visions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check scripts/audit-published-releases.js
      - run: node scripts/audit-published-releases.js
      - name: Probe deployed series/reader routes and assets (advisory before merge)
        if: ${{ github.event_name == 'pull_request' }}
        timeout-minutes: 5
        continue-on-error: true
        run: node scripts/audit-published-releases.js --live --live-strict
      - name: Probe deployed routes on demand
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe_live }}
        run: node scripts/audit-published-releases.js --live --live-strict

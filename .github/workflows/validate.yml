name: Validate both sites

on:
  pull_request:
  push:
    branches:
      - main
      - agent/**

permissions:
  contents: read

jobs:
  visions:
    name: Star Splitter Visions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sites/visions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sites/visions/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  records:
    name: Star Splitter Records content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sites/records
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sites/records/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

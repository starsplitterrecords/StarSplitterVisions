name: IMG artifact bridge Azure Reach canon

on:
  push:
    branches:
      - img-artifact-bridge-azure-canon
    paths:
      - '.github/workflows/img-artifact-bridge-azure-canon.yml'

permissions:
  contents: read

jobs:
  export-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify targets exist
        run: |
          test -f sites/visions/public/images/pages/azure-reach/issue-01/page-010.jpg
          test -f sites/visions/public/images/pages/azure-reach/issue-01/page-014.jpg
      - name: Upload canon pages
        uses: actions/upload-artifact@v4
        with:
          name: azure-reach-canon-p10-p14
          path: |
            sites/visions/public/images/pages/azure-reach/issue-01/page-010.jpg
            sites/visions/public/images/pages/azure-reach/issue-01/page-014.jpg
          retention-days: 1

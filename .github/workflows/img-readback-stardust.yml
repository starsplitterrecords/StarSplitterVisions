name: IMG Readback Stardust

on:
  push:
    paths:
      - '.github/workflows/img-readback-stardust.yml'

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare exact released references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p readback
          cp sites/visions/public/images/pages/stardust-station/issue-01/page-022.jpg readback/page-022.jpg
          cp sites/visions/public/images/pages/stardust-station/issue-01/page-005.jpg readback/page-005.jpg
          cp sites/visions/public/images/pages/stardust-station/issue-01/page-002.jpg readback/page-002.jpg
          sha1sum readback/*
      - name: Upload exact pixels
        uses: actions/upload-artifact@v4
        with:
          name: stardust-released-reference-readback
          path: readback/
          if-no-files-found: error
          retention-days: 1

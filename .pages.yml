          - name: centerQuote
            label: Center Quote
            type: text
          - name: topPullquote
            label: Top Pullquote
            type: text
          - name: principlesTitle
            label: Principles Heading
            type: string
          - name: principles
            type: string
            list: true
          - name: bottomPullquote
            label: Bottom Pullquote
            type: text
      - name: contact
        label: Contact
        type: file
        path: sites/visions/src/content/pages/contact.json
        format: json

name: Materialize approved Stardust preview

on:
  pull_request:
    branches: [main]
    paths:
      - '.staging/stardust-approved-preview-v3/**'
      - '.github/workflows/materialize-stardust-approved-preview-v3.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Reconstruct approved PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sites/visions/public/issues/stardust-station/issue-01
          cat .staging/stardust-approved-preview-v3/chunk-*.txt | base64 --decode > sites/visions/public/issues/stardust-station/issue-01/stardust-station-issue-01-mandatory-proximity-preview.pdf
          test "$(stat -c%s sites/visions/public/issues/stardust-station/issue-01/stardust-station-issue-01-mandatory-proximity-preview.pdf)" -eq 151402
          echo '2ae933a7c94ad9e4ee9866dfbed3328537105cef474b01ce6112521c681ad213  sites/visions/public/issues/stardust-station/issue-01/stardust-station-issue-01-mandatory-proximity-preview.pdf' | sha256sum -c -
          head -c 4 sites/visions/public/issues/stardust-station/issue-01/stardust-station-issue-01-mandatory-proximity-preview.pdf | grep -q '%PDF'
      - name: Commit release asset and remove transfer staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .staging/stardust-approved-preview-v3
          rm -f .github/workflows/materialize-stardust-approved-preview-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add approved Stardust Issue 01 preview PDF'
          git push origin HEAD:${{ github.head_ref }}

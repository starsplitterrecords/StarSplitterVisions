name: Validate site

on:
  pull_request:
  push:
    branches:
      - main
      - agent/**

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and refresh lockfile
        run: npm install

      - name: Commit refreshed lockfile
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/agent/')
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh package lock"
          git push

      - name: Audit and lint
        run: npm run check

      - name: Build production site
        run: npm run build
